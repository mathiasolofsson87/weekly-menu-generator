generate_menu:
  fields:
    week_start:
      required: false
      example: "2026-11-02"
      selector:
        date:
    hint:
      required: false
      example: "more vegetarian this week"
      selector:
        text:
regenerate_day:
  fields:
    date:
      required: true
      example: "2026-11-03"
      selector:
        date:
    hint:
      required: false
      example: "something with fish"
      selector:
        text:
swap_days:
  fields:
    date:
      required: true
      example: "2026-11-03"
      selector:
        date:
    other_date:
      required: true
      example: "2026-11-05"
      selector:
        date:
lock_day:
  fields:
    date:
      required: true
      example: "2026-11-03"
      selector:
        date:
    locked:
      required: false
      default: true
      selector:
        boolean:
set_recipe:
  fields:
    date:
      required: true
      example: "2026-11-03"
      selector:
        date:
    recipe_id:
      required: true
      example: "ai_task:3f2a9c1b7d4e"
      selector:
        text:
confirm_menu:
  fields:
    week_start:
      required: false
      example: "2026-11-02"
      selector:
        date:
add_to_shopping:
  fields:
    week_start:
      required: false
      example: "2026-11-02"
      selector:
        date:
    everything:
      required: false
      default: false
      selector:
        boolean:
set_member:
  fields:
    name:
      required: false
      example: "Anna"
      selector:
        text:
    id:
      required: false
      selector:
        text:
    person:
      required: false
      selector:
        entity:
          domain: person
    allergies:
      required: false
      example: '["milk", "kiwi"]'
      selector:
        object:
    dislikes:
      required: false
      example: '["svamp"]'
      selector:
        object:
    likes:
      required: false
      selector:
        object:
    diet:
      required: false
      selector:
        select:
          options:
            - omnivore
            - vegetarian
            - vegan
            - pescatarian
    portion:
      required: false
      selector:
        select:
          options:
            - small
            - normal
            - large
    attends:
      required: false
      example: '["mon", "tue", "wed"]'
      selector:
        object:
    cook_separately:
      required: false
      selector:
        boolean:
remove_member:
  fields:
    name:
      required: false
      example: "Anna"
      selector:
        text:
    id:
      required: false
      selector:
        text:
