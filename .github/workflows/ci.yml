name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  python:
    name: Python (lint and tests)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: requirements-test.txt
      - name: Install
        run: |
          pip install -r requirements-test.txt
          pip install $(python scripts/ha_extra_requirements.py)
      - name: Lint
        run: |
          ruff check .
          ruff format --check .
      - name: Test
        run: pytest -q

  frontend:
    name: Dashboard cards (types, tests, build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
      - name: The committed bundle is up to date
        working-directory: .
        run: |
          git diff --exit-code -- custom_components/weeklymenu/www || {
            echo "::error::weeklymenu-cards.js is out of date. Run 'npm run build' in frontend/ and commit the result."
            exit 1
          }
